  <rect width="1000" height="1000" fill="url(#bg6)"/>
  <rect width="1000" height="1000" fill="url(#warm6)"/>
  <rect width="1000" height="1000" fill="url(#cool6)"/>

  <!-- geometrik detaylar -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2">
    <circle cx="280" cy="300" r="210"/>
    <circle cx="280" cy="300" r="330"/>
  </g>
  <path d="M-40 540 L1040 660" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M-40 820 L1040 850" stroke="#000000" stroke-opacity="0.18" stroke-width="6"/>

  <rect width="1000" height="1000" fill="url(#scrim6)"/>
