<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     width="1000" height="1000" role="presentation">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#00B0FF"/>
    </linearGradient>
    <radialGradient id="warm5" cx="0.3" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool5" cx="0.78" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#10173A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#10173A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg5)"/>
  <rect width="1000" height="1000" fill="url(#warm5)"/>
  <rect width="1000" height="1000" fill="url(#cool5)"/>

  <!-- geometrik detaylar -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2">
    <circle cx="660" cy="560" r="210"/>
    <circle cx="660" cy="560" r="330"/>
  </g>
  <path d="M-40 480 L1040 620" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M-40 790 L1040 795" stroke="#000000" stroke-opacity="0.18" stroke-width="6"/>

  <rect width="1000" height="1000" fill="url(#scrim5)"/>
</svg>
