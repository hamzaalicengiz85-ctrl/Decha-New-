<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     width="1000" height="1000" role="presentation">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E93"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="warm2" cx="0.3" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#FF9CD8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF9CD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool2" cx="0.78" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#2E1065" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2E1065" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg2)"/>
  <rect width="1000" height="1000" fill="url(#warm2)"/>
  <rect width="1000" height="1000" fill="url(#cool2)"/>

  <!-- geometrik detaylar -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2">
    <circle cx="660" cy="300" r="210"/>
    <circle cx="660" cy="300" r="330"/>
  </g>
  <path d="M-40 300 L1040 500" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M-40 700 L1040 630" stroke="#000000" stroke-opacity="0.18" stroke-width="6"/>

  <rect width="1000" height="1000" fill="url(#scrim2)"/>
